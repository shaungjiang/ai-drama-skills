style_id: cinematic_3d_donghua
image_style: 高品质半写实3D仙侠国漫角色，精致东方青年面孔，脸颊和下颌过渡柔和，清晰但不过分方硬的骨相，细腻自然皮肤与柔和次表面散射，眼窝有深度、眼睑与唇部有细节，眼神灵动克制；长发有真实发束体积、轻柔散丝和顺滑高光；古装为细密织物、层叠领口与精巧金属纹饰，角色呈现高规格CG仙侠动画镜头质感
composition: 胸像或中近景时以人物脸部为视觉中心，自然东亚头身与五官比例，前中后景分离；浅景深柔化暗背景，手部和关键道具镜头提高景深；墨青、米白和古铜为主色，背景可有少量失焦暖金光点，光效不遮挡脸部
lighting: 侧前方大面积柔光塑造眼窝、鼻梁与唇部，弱冷色环境光填暗部，细窄暖色轮廓光分离发丝与肩部，皮肤亮部不过曝；暗背景保留空间，金色法术光效仅在剧情要求时出现
character: 成年东方青年，细长自然眼型、精细眉毛、挺直自然鼻梁、自然唇形；头发体积与散丝兼具，五官不做真人摄影式粗糙毛孔，也不做卡通大眼；参考风格不替代角色身份，保留已批准人物的脸型、发型、衣装和饰物
reference_intent: 用户选择精致半写实3D仙侠CG审美。参考截图只作为本地美术依据，不复制人物身份、字幕、平台界面或具体文字。
avoid:
  - 塑料皮肤
  - 廉价游戏建模
  - 低多边形NPC质感
  - 方硬下颌和粗糙过熟面相
  - 僵硬发束和假发块
  - 扁平正面照明
  - 夸张大眼娃娃脸
  - 夸张卡通比例
  - 五官变形
  - 服装细节混乱
  - 2D与3D混杂
