style_id: cinematic_live_action
image_style: 影视写实摄影，真实东亚面孔，自然皮肤纹理与细小瑕疵，真实服装材质、建筑比例和空间透视，克制电影调色
composition: 景别服务人物目标；眼平摄影与稳定轴线，留出视线和动作空间；适度景深，关键物体与双人关系清晰
lighting: 窗光、灯具或室外自然光作为可追踪来源，保持合理明暗比例和统一白平衡
character: 表情克制，头身比例与解剖自然；不使用动漫眼型和完美磨皮
avoid:
  - 动漫脸
  - 蜡像皮肤
  - 过度磨皮
  - 五官不对称
  - 不自然肢体
  - 不真实背景
